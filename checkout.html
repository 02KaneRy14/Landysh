<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra — Landysh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============================ -->
  <!-- HEADER -->
  <!-- ============================ -->
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1 class="brand-title">Landysh<span class="dot">.</span></h1>
        <p class="brand-tagline">Tu tienda de confianza</p>
      </div>
      <nav class="site-nav">
        <ul>
          <li><a href="index.html#inicio" class="nav-link">Inicio</a></li>
          <li><a href="index.html#productos" class="nav-link">Productos</a></li>
          <li><a href="index.html#contacto" class="nav-link">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ============================ -->
  <!-- SECCIÓN DE CHECKOUT -->
  <!-- ============================ -->
  <main class="checkout-main">
    <section class="checkout-section">
      <h2>Finalizar Compra</h2>
      <p>Por favor, revisa tus datos y confirma tu pedido. Solo se acepta <strong>pago en efectivo al entregar los productos.</strong></p>

      <form class="checkout-form" id="formulario">
        <h3>Datos del cliente</h3>
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="tel" name="telefono" placeholder="Teléfono de contacto" required>
        <textarea name="direccion" placeholder="Dirección de entrega completa" rows="3" required></textarea>

        <h3>Método de pago</h3>
        <div class="pago-opcion">
          <label>
            <input type="radio" name="metodo" value="efectivo" checked>
            <strong>Efectivo al entregar</strong><br>
            <small>Pagarás el total en efectivo cuando recibas tu pedido en casa.</small>
          </label>
        </div>

        <div class="form-actions">
          <a href="index.html" class="btn btn-ghost">Volver</a>
          <button type="submit" class="btn btn-primary">Confirmar pedido</button>
        </div>

        <!-- 🔥 SOLO AGREGADO (NO SE MODIFICÓ NADA) -->
        <input type="hidden" name="productos" id="productos">
        <input type="hidden" name="precioProducto" id="precioProducto">
        <input type="hidden" name="total" id="total">

      </form>
    </section>
  </main>

  <!-- ============================ -->
  <!-- FOOTER -->
  <!-- ============================ -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Landysh. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- ============================ -->
  <!-- ESTILO INTERNO ESPECÍFICO -->
  <!-- ============================ -->
  <style>
    .checkout-main {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--fondo-principal);
      padding: 2rem;
    }

    .checkout-section {
      background-color: var(--fondo-secundario);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .checkout-section h2 {
      text-align: center;
      margin-bottom: 1rem;
      color: var(--acento-suave1);
    }

    .checkout-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .checkout-form input,
    .checkout-form textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--detalle2);
      border-radius: var(--radius);
      background-color: var(--fondo-terciario);
      color: var(--texto-principal);
    }

    .checkout-form input:focus,
    .checkout-form textarea:focus {
      border-color: var(--acento-suave1);
      outline: none;
    }

    .pago-opcion {
      background-color: var(--fondo-terciario);
      padding: 1rem;
      border-radius: var(--radius);
    }

    .pago-opcion label {
      display: block;
      color: var(--texto-principal);
    }

    .pago-opcion small {
      color: var(--detalle2);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }
  </style>

 <!-- ============================ -->
<!-- EMAILJS + CARRITO REAL -->
<!-- ============================ -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
  emailjs.init("wGysjER1RCSqjRTtS");

  document.getElementById("formulario").addEventListener("submit", function(e){
    e.preventDefault();

    // 🛒 CARRITO REAL DESDE TU SISTEMA
    let cart = JSON.parse(localStorage.getItem("landyshCart")) || [];
if(cart.length === 0){
  alert("⚠️ Tu carrito está vacío");
  return;
}
    let productosTexto = "";
    let total = 0;

    cart.forEach(item => {
      let subtotal = item.price * item.quantity;
      productosTexto += `${item.name} x${item.quantity} = $${subtotal.toFixed(2)}\n`;
      total += subtotal;
    });

    // 📤 ENVIAR AL FORMULARIO
    document.getElementById("productos").value = productosTexto;
    document.getElementById("precioProducto").value = "Ver detalle en productos";
    document.getElementById("total").value = "$" + total.toFixed(2);

    // 📩 ENVIAR EMAIL
    emailjs.sendForm(
      "service_5d488st",
      "template_g4b4tj7",
      this
    )
    .then(function(){
      alert("✅ Pedido enviado correctamente");

      // 🧹 limpiar carrito después del pedido
      localStorage.removeItem("landyshCart");

      document.getElementById("formulario").reset();
    }, function(error){
      alert("❌ Error al enviar el pedido");
      console.log(error);
    });

  });
</script>

</body>
</html>
