<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2b2a33" />
  <title>Mi Cuenta — Landysh</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ENCABEZADO -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="brand">
        <a href="index.html" aria-label="Volver al inicio de Landysh">
          <h1 class="brand-title">Landysh<span class="dot">.</span></h1>
        </a>
      </div>
      <nav class="site-nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#productos">Productos</a></li>
          <li><a href="index.html#ofertas">Ofertas</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="main" class="site-main container">
    <section class="cuenta" aria-labelledby="cuentaTitle">
      <h2 id="cuentaTitle">Mi Cuenta</h2>

      <!-- TARJETA DE USUARIO / LOGIN -->
      <div class="cuenta-panel">
        <!-- LOGIN -->
        <form id="loginForm" class="auth-form" method="post" action="/login" novalidate>
          <h3>Iniciar sesión</h3>
          <label for="loginEmail">Correo electrónico</label>
          <input id="loginEmail" name="email" type="email" placeholder="tucorreo@ejemplo.com" required>

          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" name="password" type="password" placeholder="••••••••" required>

          <button type="submit" class="btn btn-primary">Ingresar</button>
          <p class="auth-alt">¿No tienes cuenta? <a href="#registro" id="showRegister">Regístrate</a></p>
        </form>

        <!-- REGISTRO -->
        <form id="registerForm" class="auth-form" method="post" action="/registro" hidden novalidate>
          <h3>Crear cuenta</h3>
          <label for="nombreRegistro">Nombre completo</label>
          <input id="nombreRegistro" name="nombre" type="text" placeholder="Tu nombre" required>

          <label for="emailRegistro">Correo electrónico</label>
          <input id="emailRegistro" name="email" type="email" placeholder="tucorreo@ejemplo.com" required>

          <label for="passwordRegistro">Contraseña</label>
          <input id="passwordRegistro" name="password" type="password" placeholder="Mínimo 6 caracteres" required minlength="6">

          <button type="submit" class="btn btn-primary">Registrar</button>
          <p class="auth-alt">¿Ya tienes cuenta? <a href="#login" id="showLogin">Inicia sesión</a></p>
        </form>
      </div>

      <!-- PANEL DE USUARIO (visible tras iniciar sesión) (aun no tenemos una base de datos para soportar cuentas por lo que queda como comentario esta seccion)
      <section id="perfilUsuario" class="perfil-usuario" hidden>
        <h3>Bienvenido, <span id="userName">Usuario</span></h3>
        <ul class="cuenta-menu">
          <li><a href="pedidos.html">Mis pedidos</a></li>,
          <li><a href="direccion.html">Direcciones guardadas</a></li>
          <li><a href="favoritos.html">Favoritos</a></li>
          <li><a href="ajustes.html">Ajustes de cuenta</a></li>
        </ul>
        <button id="logoutBtn" class="btn btn-ghost">Cerrar sesión</button>
      </section>
    </section>
  </main>
-->
  <!-- PIE DE PÁGINA -->
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <p>&copy; <span id="currentYear">2025</span> Landysh. Todos los derechos reservados.</p>
      <nav>
        <ul>
          <li><a href="privacidad.html">Privacidad</a></li>
          <li><a href="envios.html">Envíos</a></li>
          <li><a href="faq.html">Preguntas frecuentes</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    // Alternar entre formularios de login y registro
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    document.getElementById('showRegister').onclick = e => {
      e.preventDefault();
      loginForm.hidden = true;
      registerForm.hidden = false;
    };
    document.getElementById('showLogin').onclick = e => {
      e.preventDefault();
      loginForm.hidden = false;
      registerForm.hidden = true;
    };

    // Mostrar año actual en footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
